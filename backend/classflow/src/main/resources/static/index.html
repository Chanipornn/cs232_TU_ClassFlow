<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Student Login</title>
  <link rel="stylesheet" href="/CSS/style.css">

   <!-- AWS Cognito -->
  <script src="https://cdn.jsdelivr.net/npm/amazon-cognito-identity-js@6.3.0/dist/amazon-cognito-identity.min.js"></script>
</head>

<body>
  <div class="login-container">

    <div class="left">
      <div class="left-content">
        <h1>Welcome !<br>ClassFlow</h1>
        <p>To assignment update</p>
      </div>
  
      <div class="circle big"></div>
      <div class="circle small"></div>
    </div>

    <div class="right">
      <h2>Sign In</h2>

      <input id="email" name="email" type="text" placeholder="Email">
      <input id="password" name="password" type="password" placeholder="Password">
      <p id="errorMsg" style="color: red; font-size: 14px; margin-top: 6px; display: none;"></p>

      <button onclick="login()">Sign In</button>
  
      <p class="signup-text">
        Don't have an account?
         <!-- <a href="Sign_up.html">Sign up</a> -->
		<a href="/HTML/Sign_up.html">Sign up</a>
      </p>
    </div>
  
  </div>
  

  <!-- Cognito Config -->
  <script>
  const poolData = {
    UserPoolId: "us-east-1_gFzKBoxUE",
    ClientId: "deuj2keprro5a2icvna5ohbg"
  };

  const userPool = new AmazonCognitoIdentity.CognitoUserPool(poolData);
  </script>

  <!-- Login -->
  <script>

    function showError(msg) {
      const el = document.getElementById("errorMsg");
      el.textContent = msg;
      el.style.display = "block";
    }

    function clearError() {
      const el = document.getElementById("errorMsg");
      el.textContent = "";
      el.style.display = "none";
    }

    function login() {
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      clearError();

      if (!email || !password) {
        showError("Please fill all fields");
        return;
      }

      if (
              !email.endsWith("@dome.tu.ac.th") &&
              email !== "chayananmariwan@gmail.com"
      ) {
        showError("Use only @dome.tu.ac.th email");
        return;
      }

      const authenticationData = {
        Username: email,
        Password: password,
      };

      const authenticationDetails =
              new AmazonCognitoIdentity.AuthenticationDetails(authenticationData);

      const userData = {
        Username: email,
        Pool: userPool,
      };

      const cognitoUser =
              new AmazonCognitoIdentity.CognitoUser(userData);

      cognitoUser.authenticateUser(authenticationDetails, {
        onSuccess: function (result) {

          const idToken = result.getIdToken().getJwtToken();
          const accessToken = result.getAccessToken().getJwtToken();
          const refreshToken = result.getRefreshToken().getToken();

          localStorage.setItem("idToken", idToken);
          localStorage.setItem("accessToken", accessToken);
          localStorage.setItem("refreshToken", refreshToken);
          localStorage.setItem("username", email);

          console.log("Login success");


          const lowerEmail = email.toLowerCase();

          const payload = JSON.parse(atob(idToken.split(".")[1]));

          const userData = {
            email: payload.email,
            cognitoSub: payload.sub,
            role:
                    lowerEmail === "chayananmariwan@gmail.com" ||
                    lowerEmail.endsWith("@tu.ac.th")
                            ? "INSTRUCTOR"
                            : "STUDENT"
          };

          fetch("/api/auth/sync-user", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(userData)
          });

          if (
                  lowerEmail === "chayananmariwan@gmail.com" ||
                  lowerEmail.endsWith("@tu.ac.th")
          ) {
            window.location.href = "/HTML/dashboard_instructor.html";
          } else {
            window.location.href = "/HTML/dashboard_student.html";
          }
        },

        onFailure: function (err) {
          showError(err.message || "Login failed");
        }
      });
    }

  </script>
</body>
</html>
