<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Student Login</title>
  <link rel="stylesheet" href="/CSS/style.css">

   <!-- AWS Cognito -->
  <script src="https://cdn.jsdelivr.net/npm/amazon-cognito-identity-js@6.3.0/dist/amazon-cognito-identity.min.js"></script>
</head>

<body>
  <div class="login-container">

    <div class="left">
      <div class="left-content">
        <h1>Welcome !<br>ClassFlow</h1>
        <p>To assignment update</p>
      </div>
  
      <div class="circle big"></div>
      <div class="circle small"></div>
    </div>
  
    <div class="right">
      <h2>Sign In</h2>
  
      <input id="email" name="email" type="text" placeholder="Email">
      <input id="password" name="password" type="password" placeholder="Password">
  
      <button onclick="login()">Sign In</button>
  
      <p class="signup-text">
        Don't have an account?
         <!-- <a href="Sign_up.html">Sign up</a> -->
		<a href="/HTML/Sign_up.html">Sign up</a>
      </p>
    </div>
  
  </div>
  

  <!-- Cognito Config -->
  <script>
  const poolData = {
    UserPoolId: "us-east-1_gFzKBoxUE",
    ClientId: "deuj2keprro5a2icvna5ohbg"
  };

  const userPool = new AmazonCognitoIdentity.CognitoUserPool(poolData);
  </script>

  <!-- Login -->
  <script>
  function login() {
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    // ===== validation =====
    if (
  	!email.endsWith("@dome.tu.ac.th")   &&
      email !== "chayananmariwan@gmail.com") {
      alert("Use only @dome.tu.ac.th email");
      return;
    }

    if (!email || !password) {
      alert("Please fill all fields");
      return;
    }

    const authenticationData = {
      Username: email,
      Password: password,
    };

    const authenticationDetails =
      new AmazonCognitoIdentity.AuthenticationDetails(authenticationData);

    const userData = {
      Username: email,
      Pool: userPool,
    };

    const cognitoUser =
      new AmazonCognitoIdentity.CognitoUser(userData);

    cognitoUser.authenticateUser(authenticationDetails, {
  	onSuccess: function (result) {

  	  // ===== Tokens =====

  	  const idToken =
  	    result.getIdToken().getJwtToken();

  	  const accessToken =
  	    result.getAccessToken().getJwtToken();

  	  const refreshToken =
  	    result.getRefreshToken().getToken();

  	  // ===== Save =====

  	  localStorage.setItem("idToken", idToken);

  	  localStorage.setItem("accessToken", accessToken);

  	  localStorage.setItem("refreshToken", refreshToken);

  	  localStorage.setItem("username", email);

  	  console.log("Login success");

  	  alert("Login success!");

  	  const lowerEmail =
  	    email.toLowerCase();

  	  // ===== decode JWT =====

  	  const payload =
  	    JSON.parse(
  	      atob(idToken.split(".")[1])
  	    );

  	  // ===== sync =====

  	  const userData = {

  	    email: payload.email,

  	    cognitoSub: payload.sub,

  	    role:
  	      lowerEmail === "chayananmariwan@gmail.com" ||
  	      lowerEmail.endsWith("@tu.ac.th")
  	        ? "INSTRUCTOR"
  	        : "STUDENT"
  	  };

  	  fetch("/api/auth/sync-user", {

  	    method: "POST",

  	    headers: {
  	      "Content-Type": "application/json"
  	    },

  	    body: JSON.stringify(userData)

  	  });

  	  if (
  	    lowerEmail === "chayananmariwan@gmail.com" ||
  	    lowerEmail.endsWith("@tu.ac.th")
  	  ) {

  	    window.location.href =
  	      "/HTML/dashboard_instructor.html";

  	  } else {

  	    window.location.href =
  	      "/HTML/dashboard_student.html";
  	  }
  	}

 });

  	}

</script>

</body>
</html>
