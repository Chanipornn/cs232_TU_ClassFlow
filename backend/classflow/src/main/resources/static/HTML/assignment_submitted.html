<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Submitted</title>
  <link rel="stylesheet" href="../css/assignment.css">
</head>

<body onload="fetchAssignments('submitted')">

<div class="header">
  <div class="header-inner">

    <div class="top-bar">
      
		<div class="back-btn"
		             onclick="window.location.href='../HTML/dashboard_student.html'">←
		          <i class="fa-solid fa-arrow-left"></i>
		        </div>
	  

      <div class="tabs">
        <button class="tab" onclick="switchTab('assignment_all.html')">All</button>
        <button class="tab" onclick="switchTab('assignment_todo.html')">To do</button>
        <button class="tab active" onclick="switchTab('assignment_submitted.html')">Submitted</button>
      </div>

      <div class="search-box">
        <input type="text" placeholder="Search..."
          oninput="searchAssignment(this.value,'submitted')">
      </div>
    </div>

    <h2 id="courseTitle">Loading...</h2>
    <p id="instructorName">Instructor: -</p>
    <p id="totalAssignments">Assignments: 0</p>

    <div class="progress-bar">
      <div class="progress" id="progressBar"></div>
    </div>

  </div>
</div>

<div class="container" id="assignmentContainer"></div>

<script src="../js/assignment.js"></script>
<script>
function goPage(page){ window.location.href = page; }
</script>

</body>
</html>
