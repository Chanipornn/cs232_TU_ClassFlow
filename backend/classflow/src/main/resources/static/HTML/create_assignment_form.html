<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Assignment</title>

  <!-- ICON -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>

  <!-- CSS -->
  <link rel="stylesheet" href="../css/create_assignment.css" />
</head>

<body>
  <div class="page-shell">

    <!-- HEADER -->
    <header class="detail-header">
      <a href="#" class="circle-btn" id="backBtn">
        <i class="fa-solid fa-arrow-left"></i>
      </a>

      <!-- เปลี่ยนตาม course -->
      <h1 id="courseTitle">Loading...</h1>

      <div class="profile-btn">
        <i class="fa-regular fa-user"></i>
      </div>
    </header>

    <!-- CONTENT -->
    <main class="detail-content">

     
      <section class="detail-card">

        <div class="form-top-fields">

          <label>Assignment Title</label>
          <input id="assignmentTitle" type="text" placeholder="Enter title"/>

          <label>Description</label>
          <textarea id="assignmentDescription" placeholder="Enter description"></textarea>

          <label>Requirements</label>
          <textarea id="assignmentRequirements" placeholder="Enter requirements"></textarea>

        </div>
		
		<div class="file-upload-section">

		    <label class="upload-label">
		      Attachment Files
		    </label>

		    <label for="assignmentFile" class="custom-file-upload">
		      <i class="fa-solid fa-paperclip"></i>
		      Choose Files
		    </label>

		    <input
		      type="file"
		      id="assignmentFile"
		      multiple
		    />

		    <div id="fileList" class="file-list">
		      No files selected
		    </div>

		  </div>

      </section>
	 

	  
      <!-- AVAILABILITY -->
      <section class="accordion-card open">
        <button class="accordion-header" type="button">
          <span>Availability</span>
          <i class="fa-solid fa-caret-down"></i>
        </button>

        <div class="accordion-content">

          <!-- START DATE -->
          <div class="form-row">
            <div class="form-block">
              <label>Allow submission from</label>
              <input type="datetime-local" id="startDate">
            </div>

            <div class="check-block">
              <label><input type="checkbox" checked /> Enable</label>
            </div>
          </div>

          <!-- DUE DATE -->
          <div class="form-row">
            <div class="form-block">
              <label>Due date</label>
              <input id="assignmentDeadline" type="datetime-local"/>
            </div>

            <div class="check-block">
              <label><input type="checkbox" checked /> Enable</label>
            </div>
          </div>

          <!-- CUT OFF -->
          <div class="form-row">
            <div class="form-block">
              <label>Cut off date</label>
              <input type="datetime-local" id="cutoffDate">
            </div>

            <div class="check-block">
              <label><input type="checkbox" checked /> Enable</label>
            </div>
          </div>

        </div>
      </section>

	  
      <!-- SUBMISSION TYPE -->
      <section class="accordion-card open">
        <button class="accordion-header" type="button">
          <span>Submission Type</span>
          <i class="fa-solid fa-caret-down"></i>
        </button>

        <div class="accordion-content">

          <div class="form-block">
            <label>Submission Type</label>

            <div class="checkbox-row">
              <label><input type="checkbox" id="fileSubmission" checked /> File Submission</label>
              <label><input type="checkbox" id="textSubmission" /> Online text</label>
            </div>
          </div>

          <div class="form-block">
            <label>Maximum number of upload files</label>
            <select id="maxFiles">
              <option value="1">1</option>
              <option value="2">2</option>
              <option value="3">3</option>
            </select>
          </div>

          <div class="form-block">
            <label>Maximum submission size (MB)</label>
            <select id="maxSize">
              <option value="32">32</option>
              <option value="64">64</option>
              <option value="128">128</option>
            </select>
          </div>

        </div>
      </section>

	  
      <!-- FEEDBACK -->
      <section class="accordion-card">
        <button class="accordion-header" type="button">
          <span>Feedback</span>
          <i class="fa-solid fa-caret-down"></i>
        </button>

        <div class="accordion-content">
          <div class="form-block">
            <label>Feedback comment</label>
            <textarea id="feedBack" rows="3" placeholder="Write feedback..."></textarea>
          </div>
        </div>
      </section>

	  
      <!-- SETTINGS -->
      <section class="accordion-card">
        <button class="accordion-header" type="button">
          <span>Submission settings</span>
          <i class="fa-solid fa-caret-down"></i>
        </button>

        <div class="accordion-content">

          <div class="form-block">
            <label>
              <input type="checkbox" id="requireSubmitBtn" />
              Require students click submit button
            </label>
          </div>

          <div class="form-block">
            <label>
              <input type="checkbox" id="allowResubmit" />
              Allow resubmission
            </label>
          </div>

        </div>
      </section>

	  
      <!-- ACTION BUTTON -->
      <div class="bottom-actions">

        <button class="cancel-btn" id="cancelBtn" type="button">
          Cancel
        </button>

        <button class="save-btn" id="saveAssignmentBtn">
          Save Assignment
        </button>

      </div>

    </main>
  </div>

  <!-- SUCCESS POPUP -->
  <div id="successPopup" class="popup-overlay">

    <div class="popup-box">

      <div class="popup-icon">

        <svg
                xmlns="http://www.w3.org/2000/svg"
                width="52"
                height="52"
                viewBox="0 0 24 24"
                fill="none"
                stroke="white"
                stroke-width="3.5"
                stroke-linecap="round"
                stroke-linejoin="round"
        >

          <polyline points="20 6 9 17 4 12"></polyline>

        </svg>

      </div>

      <h2>Success</h2>

      <p id="popupMessage">
        Assignment created successfully
      </p>


    </div>

  </div>

  <script src="../js/create_assignment.js"></script>

</body>
</html>
