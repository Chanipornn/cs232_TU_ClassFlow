<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dashboard</title>

  <link rel="stylesheet" href="../CSS/dashboard_student.css">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fullcalendar/core@6.1.8/main.min.css">
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>
</head>

<body>

  <!-- HEADER -->
  <div class="header">
    <div class="logo">TU ClassFlow</div>

    <div class="right-header">
      <a href="Notification.html">
        <img src="../src/notification.png" class="icon-bell">
      </a>
      <span id="username">Guest</span>
      <img src="../src/avatar.png" class="avatar" id="avatar">
      <input type="file" id="uploadAvatar" hidden>
    </div>
  </div> <!-- ปิดให้ถูก -->

  <!-- TOP SECTION -->
  <div class="top-section">

    <!-- LEFT -->
    <div class="left-panel">

      <div class="course-tabs">
        <button class="tab active">My Courses</button>
        <button class="tab" onclick="goToAllCourses()">All courses</button>
      </div>

      <h3>Calendar</h3>
      <div id="calendar"></div>

    </div>

    <!-- RIGHT -->
    <div class="right-panel">
      <h2>Announcement</h2>

      <div class="student-announcement-scroll">

        <div class="student-announcement">
          <div>
            <b>📢 Midterm Exam Announcement</b><br>
            Instructor: Dr. Somchai<br>
            Date: 10 Mar 2026<br>
            Midterm exam will be held on 20 March.
          </div>

      
        </div>

      </div>
    </div>

  </div>

  <!-- COURSES -->
  <div class="courses-header">
    <h2>Courses</h2>

    <div class="search-box">
      <input type="text" id="searchInput" class="search" placeholder="Search..." onkeyup="searchCourse  ()">
      <div class="search-icon-box">
        <img src="../src/search-interface-symbol.png">
      </div>
    </div>
  </div>

  <div id="myCoursesContainer"></div>

  <script src="../JS/dashboard_student.js"></script>

  <!-- Username -->
  <script>
  function getEmailFromToken() {
    const token = localStorage.getItem("idToken");
    if (!token) return "Guest";

    // decode JWT
    const payload = JSON.parse(atob(token.split(".")[1]));

    return payload.email || payload["cognito:username"] || "Guest";
  }

  document.addEventListener("DOMContentLoaded", () => {
    const email = getEmailFromToken();
	const name = email.split("@")[0];
	document.getElementById("username").textContent = name;
    
  });
  </script>
  
</body>
</html>
