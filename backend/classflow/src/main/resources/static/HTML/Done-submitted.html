<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Done submitted</title>
    <link rel="stylesheet" href="../CSS/Done-submitted.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

        <div class="main-container">
        <header class="header-blue">
            <a href="assignment_all.html" class="back-btn"><i class="fas fa-arrow-left"></i></a>
            <div class="header-info">
                <h1 id="assign-title">Loading...</h1>
            </div>
            <div class="user-profile"><i class="fas fa-user-circle"></i></div>
        </header>

    <!--Description-->
        <div class="submission" id="assignment-detail-container">
            <p>Loading details...</p>
        </div>

    <!--Submission-->
    <div class="submission">
        <h3>Submission</h3>
        <table>
            <tr>
                <td>Submission status</td>
                <td id="sub-status-text">...</td>
            </tr>
            <tr>
                <td>Due date</td>
                <td id="sub-due-date">...</td>
            </tr>
            <tr>
                <td>Submission status</td>
                <td id="sub-done-status">...</td>
            </tr>
            <tr>
                <td>File Submission</td>
                <td id="sub-file-link">...</td>
            </tr>
        </table>
    </div>

    <!--Feedback-->
    <div class="submission">
        <h3>Feedback</h3>
        <table>
            <tr>
                <td>Grade</td>
                <td id="fb-grade">...</td>
            </tr>
            <tr>
                <td>Comment</td>
                <td id="fb-comment">...</td>
            </tr>
            <tr>
                <td>Graded by</td>
                <td id="fb-teacher">...</td>
            </tr>
        </table>
    </div>


</div>
    <script src="../JS/Done-submitted.js" defer></script>
</body>
</html>
