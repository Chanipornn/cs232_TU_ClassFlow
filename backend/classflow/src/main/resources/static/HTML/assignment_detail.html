<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Assignment Detail</title>

  <link rel="stylesheet" href="../css/edit_submission.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
</head>

<body>

  <header class="top-header">
    <div class="header-inner">
      <a href="assignment_all.html" class="back-btn">
        <i class="fa-solid fa-arrow-left"></i>
      </a>

      <!-- ← เปลี่ยนเป็น dynamic -->
      <h1 id="assignmentTitle">Loading...</h1>

      <a href="#" class="profile-btn">
        <i class="fa-regular fa-user"></i>
      </a>
    </div>
  </header>

  <main class="page">
    <section class="assignment-card">
      <div class="assignment-content">
        <p class="title-label">Description</p>
        <p class="text-main" id="assignmentDescription">Loading...</p>

        <p class="title-label">Requirements</p>
        <p class="text-main" id="assignmentRequirements">Loading...</p>

        <p class="title-label">Due Date</p>
        <p class="text-main" id="assignmentDueDate">Loading...</p>

        <p class="title-label">Time remaining</p>
        <p class="text-main" id="assignmentTimeRemaining">Loading...</p>
      </div>

      <div class="status-badge">YOU HAVE NOT MADE A SUBMISSION YET</div>
    </section>

    <section class="submission-card">
      <h2>Submission</h2>

      <div class="submission-inner">
        <input type="file" id="fileInput" hidden>

        <div class="upload-box empty" id="uploadBox">
          <div class="upload-note">Maximum size for files: 32MB</div>

          <div class="upload-empty-state">
            <h3>Drop file here</h3>

            <div class="upload-icon">
              <i class="fa-solid fa-box"></i>
            </div>

            <span>PDF, PNG, JPEG, Document etc.</span>
          </div>

          <div id="fileName" style="margin-top:10px; font-weight:500;"></div>
        </div>

        <div class="upload-actions">
          <button type="button" id="linkBtn"><i class="fa-solid fa-link"></i> Link</button>
          <button type="button" id="driveBtn"><i class="fa-brands fa-google-drive"></i> Drive</button>
          <button type="button" id="dropboxBtn"><i class="fa-brands fa-dropbox"></i> Dropbox</button>
          <button type="button" id="fileBtn">
            <i class="fa-solid fa-folder"></i> File
          </button>
        </div>
      </div>

      <div class="submit-actions">
        <button class="primary-btn" id="submitBtn" type="button">Submit</button>
        <button class="secondary-btn" type="button" id="cancelBtn">Cancel</button>
      </div>
    </section>
  </main>

  <script src="../JS/assignment_detail.js"></script>

</body>
</html>
