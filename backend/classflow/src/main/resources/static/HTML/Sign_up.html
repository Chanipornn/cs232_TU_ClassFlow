<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Student Sign Up</title>
  <link rel="stylesheet" href="../CSS/style.css">

  <!-- AWS Cognito -->
  <script src="https://cdn.jsdelivr.net/npm/amazon-cognito-identity-js@6.3.0/dist/amazon-cognito-identity.min.js"></script>

</head>

<body>

<div class="login-container">

  <!-- LEFT -->
  <div class="left">
    <div class="left-content">
      <h1>Welcome !<br>ClassFlow</h1>
      <p>To assignment update</p>
    </div>

    <div class="circle big"></div>
    <div class="circle small"></div>
  </div>

  <!-- RIGHT -->
  <div class="right">
    <h2>Sign up</h2>

    <input id="email" name="email" type="email" placeholder="Name.exp@dome.tu.ac.th">

    <input id="password" name="password" type="password" placeholder="Password">
    <small class="hint">*There must be at least 8 characters</small>

    <input id="confirmPassword" type="password" placeholder="Confirm Password">

    <button onclick="signUp()">Sign up</button>

    <p class="signup-text">
      Already have an account?
      <a href="index.html">Sign in</a>
    </p>
  </div>

</div> 

<!-- Cognito Config -->
<script>
const poolData = {
  UserPoolId: "us-east-1_gFzKBoxUE",
  ClientId: "deuj2keprro5a2icvna5ohbg"
};

const userPool = new AmazonCognitoIdentity.CognitoUserPool(poolData);
</script>

<!-- Sign Up -->
<script>
function signUp() {
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  const confirmPassword = document.getElementById("confirmPassword").value;

  if (!email.endsWith("@dome.tu.ac.th")) {
    alert("Use only @dome.tu.ac.th email");
    return;
  }

  if (password.length < 8) {
    alert("Password must be at least 8 characters");
    return;
  }

  if (password !== confirmPassword) {
    alert("Password not match");
    return;
  }

  const btn = document.querySelector("button");
  btn.disabled = true;

  const attributeList = [];

  const dataEmail = {
    Name: "email",
    Value: email
  };

  attributeList.push(
    new AmazonCognitoIdentity.CognitoUserAttribute(dataEmail)
  );

  userPool.signUp(email, password, attributeList, null, function(err, result) {

    btn.disabled = false;

    if (err) {
      console.error(err);

      if (err.code === "UsernameExistsException") {
        alert("This email is already registered");
      } else if (err.code === "InvalidPasswordException") {
        alert("Password does not meet requirements");
      } else {
        alert(err.message || "Signup failed");
      }

      return;
    }

    alert("Signup success! Check your email for OTP verification");
    window.location.href = "confirm.html";
  });
}
</script>

</body>
</html>
