#ทำให้หน้าข้อมูล Student ต่อ js ได้
spring.web.resources.static-locations=classpath:/static/
spring.mvc.static-path-pattern=/**

# AWS EventBridge & SNS
aws.eventbridge.bus=classflow-bus
aws.sns.topic.arn=arn:aws:sns:us-east-1:894565488512:classflow-notifications
