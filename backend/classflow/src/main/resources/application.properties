# AWS RDS
spring.datasource.url=jdbc:mysql://classflow-db.croufwujbqvh.us-east-1.rds.amazonaws.com:3306/classflow
spring.datasource.username=admin
spring.datasource.password=classflow123

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# JPA / Hibernate
#create, create-drop, validate, update, none
spring.jpa.hibernate.ddl-auto=update

# SQL Console
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# AWS S3
aws.accessKey=
aws.secretKey=
aws.sessionToken=

aws.region=us-east-1
aws.s3.bucket=classflow-submissions

