# App Info
spring.application.name=classflow
server.port=8080

# Security (AWS Cognito)
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://cognito-idp.us-east-1.amazonaws.com/us-east-1_gFzKBoxUE

# Database (MySQL)
#spring.datasource.url=jdbc:mysql://localhost:3306/classflow_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
