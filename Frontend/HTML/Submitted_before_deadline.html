<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>submitted before deadline</title>
    <link rel="stylesheet" href="../CSS/Submitted_before_deadline.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="main-container">   
        <header class="header-blue">
            <a href="assignment_all.html" class="back-btn"><i class="fas fa-arrow-left"></i></a>
            <div class="header-info">
                <h1 id="assign-title">Loading...</h1>
            </div>
            <div class="user-profile"><i class="fas fa-user-circle"></i></div>
        </header>

    <!--Description-->
    <div class="submission" id="assignment-detail-container">
        <p>Loading details...</p>
        </div>

    <!--Submission-->
    <div class="submission">
        <h3>Submission</h3>
        <table>
            <tr>
                <td>Submission status</td>
                <td id="sub-status">...</td>
            </tr>
            <tr>
                <td>Due date</td>
                <td id="sub-due-date">...</td>
            </tr>
            <tr>
                <td>Grading status</td>
                <td id="sub-grading">...</td>
            </tr>
            <tr>
                <td>File Submission</td>
                <td id="sub-file">...</td>
            </tr>
        </table>
    </div>

    <a href="#" id="edit-link" class="edit-btn">Edit submission</a>
    <div class="note">You can still make changes to your submission</div>

</div>

    <script src="../JS/Submitted_before_deadline.js" defer></script>

</body>
</html>
